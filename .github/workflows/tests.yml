name: Tests

on:
  push:
    branches: [main, dev, "test/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, tests and coverage
        run: bash ./gradlew build

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = "tests/build/reports/jacoco/test/jacocoTestReport.csv"
          if not os.path.exists(path):
              print("Coverage report not found")
              raise SystemExit
          rows = list(csv.DictReader(open(path, encoding="utf-8")))
          def pct(missed, covered):
              total = missed + covered
              return f"{100 * covered / total:.1f} % ({covered}/{total})" if total else "-"
          print("| Package | Lines | Branches | Instructions |")
          print("|-|-|-|-|")
          totals = {}
          for package in sorted({r["PACKAGE"] for r in rows}):
              part = [r for r in rows if r["PACKAGE"] == package]
              values = {}
              for key in ("LINE", "BRANCH", "INSTRUCTION"):
                  m = sum(int(r[key + "_MISSED"]) for r in part)
                  c = sum(int(r[key + "_COVERED"]) for r in part)
                  values[key] = (m, c)
                  tm, tc = totals.get(key, (0, 0))
                  totals[key] = (tm + m, tc + c)
              print(f"| {package} | {pct(*values['LINE'])} | {pct(*values['BRANCH'])} | {pct(*values['INSTRUCTION'])} |")
          print(f"| **Total** | {pct(*totals['LINE'])} | {pct(*totals['BRANCH'])} | {pct(*totals['INSTRUCTION'])} |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: tests/build/reports/jacoco/test/html
